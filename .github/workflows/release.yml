name: Release

on:
  push:
    tags: [ 'v*' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  # The single version line built by this branch.
  VERSION: '26.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Resolve release metadata
        run: |
          mod_id=$(grep -E '^mod_id' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          mod_version=$(grep -E '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')

          # gradle.properties is the single source of truth for the version, the tag only triggers.
          # The -26+ suffix keeps this branch's tags distinct from the main line's: git tags are
          # repository wide, so a bare v<version> is already taken by a main line release.
          if [ "${GITHUB_REF_NAME}" != "v${mod_version}-26+" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must be v${mod_version}-26+ (mod_version in gradle.properties is ${mod_version})."
            exit 1
          fi

          {
            echo "MOD_ID=${mod_id}"
            echo "MOD_VERSION=${mod_version}"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Verify release jar
        run: |
          jar="build/libs/${MOD_ID}-${VERSION}-${MOD_VERSION}.jar"
          if [ ! -f "${jar}" ]; then
            echo "::error::${VERSION} did not produce ${jar}."
            exit 1
          fi
          ls -l "${jar}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/libs/${{ env.MOD_ID }}-${{ env.VERSION }}-${{ env.MOD_VERSION }}.jar

      - name: Write CurseForge changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${GITHUB_REF_NAME}" --json body --jq .body > "${RUNNER_TEMP}/curseforge-changelog.md"

      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != ''
        run: ./gradlew ":${VERSION}:publishCurseForge" -Pcurseforge_changelog_file="${RUNNER_TEMP}/curseforge-changelog.md"

      - name: Skip notice
        if: env.CURSEFORGE_TOKEN == ''
        run: echo "CURSEFORGE_TOKEN is not configured, skipped the CurseForge upload."
