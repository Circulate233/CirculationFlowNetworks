name: Release

on:
  push:
    tags: [ 'v*' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  # Lets Gradle reuse the JDKs installed below instead of asking foojay for them.
  JDK_ENV: JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
  # The version lines built by this branch. A branch with different lines carries its own copy
  # of this workflow.
  VERSIONS: 1.12.2 1.20.1 1.21.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDKs
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25

      - name: Pin JAVA_HOME to Java 25
        run: |
          if [ -n "${JAVA_HOME_25_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_25_X64}" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Resolve release metadata
        run: |
          mod_id=$(grep -E '^mod_id' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          mod_version=$(grep -E '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')

          # gradle.properties stays the single source of truth for the version, the tag only triggers.
          if [ "${GITHUB_REF_NAME}" != "v${mod_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version ${mod_version} in gradle.properties."
            exit 1
          fi

          {
            echo "MOD_ID=${mod_id}"
            echo "MOD_VERSION=${mod_version}"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -Dorg.gradle.java.installations.fromEnv="${JDK_ENV}"

      - name: List release jars
        run: ls -l build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Matches only the release jars, never the -dev or -sources classifiers.
          files: build/libs/${{ env.MOD_ID }}-*-${{ env.MOD_VERSION }}.jar

      - name: Write CurseForge changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${GITHUB_REF_NAME}" --json body --jq .body > "${RUNNER_TEMP}/curseforge-changelog.md"

      # Checked up front so a release cannot end up half published: CurseForge uploads cannot be
      # undone from here, and a missing jar must abort before the first upload.
      - name: Verify release jars
        run: |
          for version in ${VERSIONS}; do
            jar="build/libs/${MOD_ID}-${version}-${MOD_VERSION}.jar"
            if [ ! -f "${jar}" ]; then
              echo "::error::${version} did not produce ${jar}."
              exit 1
            fi
            echo "OK ${jar}"
          done

      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != ''
        run: |
          for version in ${VERSIONS}; do
            echo "::group::CurseForge upload for ${version}"
            ./gradlew ":${version}:publishCurseForge" \
              -Pcurseforge_changelog_file="${RUNNER_TEMP}/curseforge-changelog.md" \
              -Dorg.gradle.java.installations.fromEnv="${JDK_ENV}"
            echo "::endgroup::"
          done

      - name: Skip notice
        if: env.CURSEFORGE_TOKEN == ''
        run: echo "CURSEFORGE_TOKEN is not configured, skipped the CurseForge upload."
